# Tests every change, then refreshes the leaderboard from the Riot API and publishes it to GitHub Pages.
# A push that breaks the tests is never published: the live site keeps the last good version.
name: Update leaderboard

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min (GitHub may delay scheduled runs a bit)
  workflow_dispatch:          # "Run workflow" button in the Actions tab (also used by the site's Update button)
  push:
    branches: [main]
  pull_request:               # test proposed changes before they are merged

permissions:
  contents: write   # save LP history / games-together to the data branch
  pages: write
  id-token: write

concurrency:
  # Pull requests get their own lane so they never wait behind (or cancel) a deploy.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'update-leaderboard' }}
  cancel-in-progress: false

jobs:
  test:
    # Code only changes on pushes and pull requests; scheduled data refreshes skip the tests.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('package-lock.json') }}

      - name: Install the test browser
        run: npx puppeteer browsers install chrome

      - name: Unit tests (scores, nicknames, roasts, LP, champion names, Riot client…)
        run: npm test

      - name: Site tests (every page, players, matchups, roasts, Update button, phone layout)
        run: npm run test:e2e

  update:
    needs: test
    # Runs when the tests passed, or when they were skipped (scheduled refresh / manual run).
    if: always() && github.event_name != 'pull_request' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Finished matches never change, so keep the downloaded ones between runs.
      - uses: actions/cache@v4
        with:
          path: data/matches
          key: matches-${{ github.run_id }}
          restore-keys: matches-

      # LP history, games together and account ids live on the "data" branch, so the bot can
      # save them without bypassing the pull-request rule on main.
      - name: Load saved data
        run: |
          git fetch --depth=1 origin data && git checkout FETCH_HEAD -- data/history.json data/group-games.json data/accounts.json             || echo "No data branch yet: starting fresh."

      # No npm install needed: building the site has no dependencies.
      - name: Refresh and build
        run: node build.js
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

      - name: Save LP history and games together (data branch)
        run: |
          git config --global user.name "leaderboard-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin data
          git worktree add "$RUNNER_TEMP/data" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/data/data"
          cp data/history.json data/group-games.json data/accounts.json "$RUNNER_TEMP/data/data/"
          cd "$RUNNER_TEMP/data"
          git add data
          git diff --cached --quiet || (git commit -q -m "Update leaderboard data" && git push origin HEAD:data)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
